    <header>
        <h1>How to use vim</h1>
    </header>
    <main>
        <section>
            <h2>How to Open/Close vim</h2>
            <p>To open vim type <code>vim filename.filetype</code> into
            the terminal.</p>
            <p>To close vim, hit escape to exit insert mode, then press
            <kdb>:q</kdb> to close without saving or use <kdb>:wq</kdb>
            to save and close.</p>
        </section>
    </main>
