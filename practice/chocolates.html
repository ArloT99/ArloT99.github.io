 <html>
    <head>
        <style>
            body{
                background: linear-gradient(135deg, #1a2980, #26d0ce);
                height: 100vh;
            }
            h1{
                text-align: center;
                font-family: Tahoma, sans-serif;
                color: white;
            }
            .container {
              display: grid;
              width: 80vw;
              height: 80vh;
              margin: auto;
              grid-template-columns: 1fr 1fr 1fr;
              grid-template-rows: 1fr 1fr 1fr;
              background-color: Thistle;
              padding: 10px;
              border-radius: 20px;
              border: 8px solid red;
            }
            .heart {
              height: 20vh; /* adjust to control the size */
              aspect-ratio: 1;
              --_m: radial-gradient(#000 69%,#0000 70%) 84.5%/50%;
              -webkit-mask-box-image: var(--_m);
                         mask-border: var(--_m);
              clip-path: polygon(-41% 0,50% 91%, 141% 0);
              background-color: chocolate;
              margin: auto;
            }
            /* fallback until better support for mask-border */
            @supports not (-webkit-mask-box-image: var(--_m)) { 
              .heart {
                mask:
                 radial-gradient(at 70% 31%,#000 29%,#0000 30%),
                 radial-gradient(at 30% 31%,#000 29%,#0000 30%),
                 conic-gradient(#000 0 0) bottom/100% 50% no-repeat;
              }
            }
            #chocolateheart{
                grid-column-start: 3;
                grid-row-start:2;
            }
            .lilbits{
                grid-column-start: 1;
                grid-row-start: 1;
                display: grid;
              grid-template-columns: 1fr 1fr 1fr;
              grid-template-rows: 1fr 1fr 1fr;
            }
            .mnm{
                width:10vh;
                height:10vh;
                background-color:red;
                border-radius:50%;
                margin: auto;
                display: grid;
                place-items: center;
                font-size: 2em;
            }
            #m1{
                grid-column:1/2;
            }
            #m2{
                grid-column:2/3;
            }
            #m3{
                grid-column:3/4;
            }
            #m4{
                grid-column:1/2;
                grid-row:2/3
            }
            
            #m5{
                grid-column:2/3;
                grid-row:2/3
            }
            #m6{
                grid-column:3/4;
                grid-row:2/3
            }
            #m7{
                grid-column:1/2;
                grid-row:3/4
            }
            #m8{
                grid-column:2/3;
                grid-row:3/4
            }
            #m9{
                grid-column:3/4;
                grid-row:3/4
            }
            /* HTML: <div class="star"></div> */
.star {
  width: 300px;
  aspect-ratio: 1;
  background: #F8CA00;
  clip-path: polygon(50% 0,
    calc(50%*(1 + sin(.4turn))) calc(50%*(1 - cos(.4turn))),
    calc(50%*(1 - sin(.2turn))) calc(50%*(1 - cos(.2turn))),
    calc(50%*(1 + sin(.2turn))) calc(50%*(1 - cos(.2turn))),
    calc(50%*(1 - sin(.4turn))) calc(50%*(1 - cos(.4turn)))
   );
  /* or more simple
  clip-path: polygon(50% 0,79% 90%,2% 35%,98% 35%,21% 90%);
   */
}

#star {
    grid-column:2/3;
}
/* HTML: <div class="hexagon"></div> */
.hexagon {
  height: 200px; /* adjust to control the size  */
  aspect-ratio: 1/cos(30deg);
  clip-path: polygon(50% -50%,100% 50%,50% 150%,0 50%);
  background: #3B8686;
}        
#hexagon {
    grid-column:3/4;
}
/* HTML: <div class="triangle"></div> */     
/* HTML: <div class="trapezoid"></div> */
.trapezoid {
  --p: 50px; /* control the shape (can be percentage) */
  height: 180px;
  aspect-ratio: 3/2;
  clip-path: polygon(var(--p) 0,calc(100% - var(--p)) 0,100% 100%,0 100%);
  background: #542437;
}
            #trapezoid {
                grid-column:1/4;
                grid-row:2/4;
        </style>
    </head>
