  <title>My Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; }
    /* Layout */
    .c1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 1rem;
    }
    .c2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
    }
    .c3 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
    }
    .c4 {
      display: flex;
      align-items: center;
      justify-content: end;
      padding: 1rem;
    }
    .c5 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 0.5rem;
    }
    .c6 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
    }

    }
    .c8 {
      padding: 1rem;
    }
    .c9 {
      padding: 1rem;
    }
    .c10 {
      padding: 1rem;
    }
    .c11 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
    }
    .c12 {
      display: grid;
      grid:
        'img text' auto
        'img text' auto
        'img text' auto
        'img text' auto
        / 1.5fr 1fr;
      padding: 2rem;
    }
    .c13 {
      display: grid;
      grid:
        'elm1 elm2 elm3' auto
        'elm1 elm2 elm3' auto
        'elm1 elm2 elm3' auto
        / 1fr 1fr 1fr;
      gap: 2rem;
      padding: 2rem;
    }
    .c14 {
      display: grid;
      grid:
        'img   img2  img3' auto
        'img4  img5  img6' auto
        'img7  img8  img9' auto
        'img10 img11 img12' auto
        'img13 img14 img15' auto
        'img16 img17 img18' auto
        'img19 img20 img21' auto
        'img22 img23 img24' auto
        'img25 img26 img27' auto
        'img28 img29 img30' auto
        'more  more  more' auto
        / 1fr 1fr 1fr;
      padding: 1rem;
    }
    .c15 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem;
    }
    .c16 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto auto auto;
      padding: 1rem;
    }
    .c17 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto auto auto;
      padding: 1rem;
    }
  </style>
</head>
